// ─── Storage (localStorage + window.storage fallback for Claude sandbox) ──────
function lsGet(k) { try { const v=localStorage.getItem(k); return v?JSON.parse(v):null; } catch { return null; } }
function lsSet(k,v) { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} }
async function sGet(k) {
  if (window.storage?.get) { try { const r=await window.storage.get(k); if(r) return JSON.parse(r.value); } catch {} }
  return lsGet(k);
}
async function sSet(k,v) {
  lsSet(k,v);
  if (window.storage?.set) { try { await window.storage.set(k,JSON.stringify(v)); } catch {} }
}
function usePersist(key, init) {
  const [val, setVal] = useState(() => lsGet(key) ?? init);
  useEffect(() => { sGet(key).then(v => { if (v !== null) setVal(v); }); }, [key]);
  const save = useCallback((fn) => {
    setVal(prev => { const next = typeof fn==="function" ? fn(prev) : fn; sSet(key,next); return next; });
  }, [key]);
  return [val, save];
}

// ─── WhatsApp share ───────────────────────────────────────────────────────────
function shareWhatsApp(audit) {
  const { session:s, ncs } = audit;
  const t    = AUDIT_TYPES.find(x=>x.id===s.auditType)||AUDIT_TYPES[0];
  const site = s.location + (s.sublocation ? " > " + s.sublocation : "");
  const lines = [
    "*" + t.label + " — NC Report*",
    "📍 " + site,
    "👤 " + s.auditor,
    "📅 " + s.date,
    "",
    "Total: " + ncs.length + " NCs | Open: " + ncs.filter(n=>n.status==="open").length + " | Closed: " + ncs.filter(n=>n.status==="closed").length,
    "",
  ].concat(ncs.map(nc => "NC" + nc.ncIndex + " [" + (nc.priority||"").toUpperCase() + "]: " + (nc.description||"")));
  window.open("https://wa.me/?text=" + encodeURIComponent(lines.join("\n")), "_blank");
}

// ─── Open report in new tab ───────────────────────────────────────────────────
function openReport(html) {
  try {
    const blob = new Blob([html], { type:"text/html;charset=utf-8" });
    const url  = URL.createObjectURL(blob);
    const w    = window.open(url, "_blank");
    if (!w) {
      // Popup blocked — download as file instead
      const a = document.createElement("a");
      a.href = url; a.download = "audit_report.html"; a.style.display="none";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  } catch(e) {
    alert("Could not open report: " + e.message);
  }
}

// ─── Word (.docx) generator ───────────────────────────────────────────────────
function generateWordReport(audit, cp) {
  const { session:s, ncs } = audit;
  const t      = AUDIT_TYPES.find(x=>x.id===s.auditType)||AUDIT_TYPES[0];
  const site   = s.location + (s.sublocation ? " \u203a " + s.sublocation : "");
  const C      = cp || {};
  const color  = t.color.replace("#","");
  const priMap = Object.fromEntries(PRIORITIES.map(p=>[p.id,p]));
  const stMap  = Object.fromEntries(STATUS_LIST.map(x=>[x.id,x]));
  const priHex = { critical:"C0392B", high:"E67E22", medium:"2980B9", low:"27AE60" };
  const esc    = str => String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

  const para = (text, bold, sz, col, align, spAfter) =>
    "<w:p><w:pPr><w:jc w:val=\"" + (align||"left") + "\"/><w:spacing w:after=\"" + (spAfter||120) + "\"/></w:pPr>" +
    "<w:r><w:rPr>" + (bold?"<w:b/>":"") + "<w:sz w:val=\"" + (sz||22) + "\"/><w:color w:val=\"" + (col||"000000") + "\"/></w:rPr>" +
    "<w:t xml:space=\"preserve\">" + esc(text) + "</w:t></w:r></w:p>";

  const hr = () => "<w:p><w:pPr><w:spacing w:before=\"60\" w:after=\"60\"/><w:pBdr><w:bottom w:val=\"single\" w:sz=\"12\" w:color=\"" + color + "\" w:space=\"1\"/></w:pBdr></w:pPr></w:p>";

  const tblHdr = (cols) =>
    "<w:tr>" + cols.map(([txt,w]) =>
      "<w:tc><w:tcPr><w:tcW w:w=\"" + w + "\" w:type=\"dxa\"/><w:shd w:val=\"clear\" w:fill=\"" + color + "\"/></w:tcPr>" +
      "<w:p><w:pPr><w:spacing w:after=\"0\"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val=\"18\"/><w:color w:val=\"FFFFFF\"/></w:rPr><w:t>" + esc(txt) + "</w:t></w:r></w:p></w:tc>"
    ).join("") + "</w:tr>";

  const tblRow = (cells, bg) =>
    "<w:tr>" + cells.map(([txt,w]) =>
      "<w:tc><w:tcPr><w:tcW w:w=\"" + w + "\" w:type=\"dxa\"/><w:shd w:val=\"clear\" w:fill=\"" + (bg||"FFFFFF") + "\"/></w:tcPr>" +
      "<w:p><w:pPr><w:spacing w:after=\"0\"/></w:pPr><w:r><w:rPr><w:sz w:val=\"18\"/></w:rPr><w:t xml:space=\"preserve\">" + esc(txt) + "</w:t></w:r></w:p></w:tc>"
    ).join("") + "</w:tr>";

  const PW = 9026;
  let body = "";

  // Cover
  if (C.companyName) body += para(C.companyName, true, 32, color, "center", 60);
  if (C.tagline)     body += para(C.tagline, false, 22, "666666", "center", 80);
  body += hr();
  body += para(t.label, true, 36, color, "center", 60);
  body += para("Non-Conformance Report", true, 24, "333333", "center", 60);
  body += para("Standard: " + t.standard, false, 20, "777777", "center", 120);
  body += para("Conducted at: " + site, false, 22, "000000", "center", 40);
  body += para("Auditor: " + s.auditor, false, 22, "000000", "center", 40);
  body += para("Date: " + s.date, false, 22, "000000", "center", 160);
  if (C.certifications) body += para("ISO/Certifications: " + C.certifications, false, 20, "555555", "center", 40);
  if (C.certBody)       body += para("Certified by: " + C.certBody, false, 20, "555555", "center", 40);
  if (C.certNumber)     body += para("Cert No.: " + C.certNumber, false, 20, "555555", "center", 40);
  body += "<w:p><w:r><w:br w:type=\"page\"/></w:r></w:p>";

  // Summary table
  body += para("NC Summary Table", true, 28, color, "left", 100);
  body += "<w:tbl><w:tblPr><w:tblW w:w=\"" + PW + "\" w:type=\"dxa\"/></w:tblPr>";
  body += tblHdr([["NC #",600],["Priority",900],["Category",1700],["Sub-location",1500],["Description",2800],["Status",1526]]);
  ncs.forEach((nc,i) => {
    const pri = priMap[nc.priority]||PRIORITIES[1];
    const st  = stMap[nc.status]||STATUS_LIST[0];
    const bg  = i%2===0?"D9E1F2":"FFFFFF";
    body += tblRow([
      ["NC-"+(nc.ncIndex||i+1),600],
      [pri.label,900],
      [nc.category||"—",1700],
      [nc.sublocation||"—",1500],
      [(nc.description||"").slice(0,80),2800],
      [st.label,1526],
    ], bg);
  });
  body += "</w:tbl>";
  body += "<w:p><w:r><w:br w:type=\"page\"/></w:r></w:p>";

  // NC details
  body += para("NC Details", true, 28, color, "left", 100);
  ncs.forEach((nc,i) => {
    const pri = priMap[nc.priority]||PRIORITIES[1];
    const st  = stMap[nc.status]||STATUS_LIST[0];
    if (i>0) body += "<w:p><w:pPr><w:spacing w:before=\"160\" w:after=\"0\"/><w:pBdr><w:top w:val=\"single\" w:sz=\"6\" w:color=\"CCCCCC\"/></w:pBdr></w:pPr></w:p>";
    body += para("NC " + (nc.ncIndex||i+1) + "  |  " + pri.label + " Priority  |  " + st.label + "  |  " + (nc.category||""), true, 22, priHex[nc.priority]||color, "left", 60);
    body += para("Site: " + site + "   Auditor: " + s.auditor + "   Date: " + s.date, false, 18, "555555", "left", 60);
    if (nc.sublocation) body += para("Sub-location: " + nc.sublocation, false, 20, "2980B9", "left", 60);
    body += para("Observation:", true, 20, "333333", "left", 40);
    body += para(nc.description||"", false, 20, "000000", "left", 80);
    if (nc.snagPhoto)    body += para("[Finding Photo attached to this NC]", false, 18, "888888", "left", 40);
    if (nc.closurePhoto) body += para("[Closure Photo attached to this NC]", false, 18, "27AE60", "left", 40);
    if (nc.closureNote)  body += para("Closure Remarks: " + nc.closureNote, false, 20, "27AE60", "left", 80);
    body += para("Logged: " + new Date(nc.createdAt).toLocaleString(), false, 16, "AAAAAA", "left", 40);
  });

  body += hr();
  const footerText = [C.certBody, C.certifications, C.certNumber?"Cert# "+C.certNumber:null, C.footerNote||"Confidential — For Management Use Only", "Generated: "+new Date().toLocaleString()].filter(Boolean).join("  |  ");
  body += para(footerText, false, 16, "888888", "center", 0);

  const docXml = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>" +
    "<w:document xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\" xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\">" +
    "<w:body><w:sectPr><w:pgSz w:w=\"11906\" w:h=\"16838\"/><w:pgMar w:top=\"900\" w:right=\"900\" w:bottom=\"900\" w:left=\"900\"/></w:sectPr>" +
    body + "</w:body></w:document>";

  const stylesXml = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>" +
    "<w:styles xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\">" +
    "<w:style w:type=\"paragraph\" w:styleId=\"Normal\"><w:name w:val=\"Normal\"/><w:rPr><w:sz w:val=\"22\"/></w:rPr></w:style>" +
    "</w:styles>";

  const relsXml = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>" +
    "<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">" +
    "<Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles\" Target=\"styles.xml\"/>" +
    "</Relationships>";

  const contentTypes = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>" +
    "<Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\">" +
    "<Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/>" +
    "<Default Extension=\"xml\" ContentType=\"application/xml\"/>" +
    "<Override PartName=\"/word/document.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml\"/>" +
    "<Override PartName=\"/word/styles.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml\"/>" +
    "</Types>";

  const rootRels = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>" +
    "<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">" +
    "<Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"word/document.xml\"/>" +
    "</Relationships>";

  // ZIP builder
  const enc = new TextEncoder();
  function crc32(buf) {
    const T = new Uint32Array(256);
    for (let n=0;n<256;n++) { let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; T[n]=c; }
    let crc=0xFFFFFFFF;
    for (let i=0;i<buf.length;i++) crc=T[(crc^buf[i])&0xFF]^(crc>>>8);
    return (crc^0xFFFFFFFF)>>>0;
  }
  function localHeader(nameBytes, dataLen, crc) {
    const d=new DataView(new ArrayBuffer(30+nameBytes.length));
    d.setUint32(0,0x04034b50,true); d.setUint16(4,20,true); d.setUint16(6,0,true); d.setUint16(8,0,true);
    d.setUint16(10,0,true); d.setUint16(12,0,true); d.setUint32(14,crc,true);
    d.setUint32(18,dataLen,true); d.setUint32(22,dataLen,true);
    d.setUint16(26,nameBytes.length,true); d.setUint16(28,0,true);
    for(let i=0;i<nameBytes.length;i++) d.setUint8(30+i,nameBytes[i]);
    return new Uint8Array(d.buffer);
  }
  function centralEntry(nameBytes, dataLen, crc, offset) {
    const d=new DataView(new ArrayBuffer(46+nameBytes.length));
    d.setUint32(0,0x02014b50,true); d.setUint16(4,20,true); d.setUint16(6,20,true);
    d.setUint16(8,0,true); d.setUint16(10,0,true); d.setUint16(12,0,true); d.setUint16(14,0,true);
    d.setUint32(16,crc,true); d.setUint32(20,dataLen,true); d.setUint32(24,dataLen,true);
    d.setUint16(28,nameBytes.length,true); d.setUint16(30,0,true); d.setUint16(32,0,true);
    d.setUint16(34,0,true); d.setUint16(36,0,true); d.setUint32(38,0,true); d.setUint32(42,offset,true);
    for(let i=0;i<nameBytes.length;i++) d.setUint8(46+i,nameBytes[i]);
    return new Uint8Array(d.buffer);
  }

  const files = [
    { name:"[Content_Types].xml", data:enc.encode(contentTypes) },
    { name:"_rels/.rels",         data:enc.encode(rootRels) },
    { name:"word/document.xml",   data:enc.encode(docXml) },
    { name:"word/styles.xml",     data:enc.encode(stylesXml) },
    { name:"word/_rels/document.xml.rels", data:enc.encode(relsXml) },
  ];

  const parts=[]; const central=[]; let offset=0;
  for (const f of files) {
    const nb=enc.encode(f.name); const crc=crc32(f.data);
    const hdr=localHeader(nb,f.data.length,crc);
    parts.push(hdr); parts.push(f.data);
    central.push(centralEntry(nb,f.data.length,crc,offset));
    offset+=hdr.length+f.data.length;
  }
  const cdStart=offset;
  const cdBytes=central.reduce((a,b)=>{ const c=new Uint8Array(a.length+b.length); c.set(a); c.set(b,a.length); return c; },new Uint8Array(0));
  const eocd=new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true); eocd.setUint16(4,0,true); eocd.setUint16(6,0,true);
  eocd.setUint16(8,files.length,true); eocd.setUint16(10,files.length,true);
  eocd.setUint32(12,cdBytes.length,true); eocd.setUint32(16,cdStart,true); eocd.setUint16(20,0,true);
  const allParts=[...parts,cdBytes,new Uint8Array(eocd.buffer)];
  const total=allParts.reduce((s,p)=>s+p.length,0);
  const out=new Uint8Array(total); let pos=0;
  for(const p of allParts){out.set(p,pos);pos+=p.length;}

  const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  const fname=(s.location||"Audit").replace(/[^a-z0-9]/gi,"_")+"_"+(t.label||"NC").replace(/\s+/g,"_")+"_"+s.date+".docx";

  // Multi-method download — works on iOS, Android, Desktop
  const url = URL.createObjectURL(blob);
  
  // Method 1: Standard anchor download (works on Android Chrome, Desktop)
  try {
    const a = document.createElement("a");
    a.href = url; a.download = fname; a.style.display = "none";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    return;
  } catch(e) {}
  
  // Method 2: Open in new tab (iOS Safari — user can then tap Share → Save to Files)
  window.open(url, "_blank");
  setTimeout(()=>URL.revokeObjectURL(url), 10000);
}

// ─── PDF generator (jsPDF via CDN) ───────────────────────────────────────────
async function generatePDF(audit, cp, onStatus) {
  const { session:s, ncs } = audit;
  const t    = AUDIT_TYPES.find(x=>x.id===s.auditType)||AUDIT_TYPES[0];
  const site = s.location + (s.sublocation ? " \u203a " + s.sublocation : "");
  const C    = cp || {};
  const col  = t.color;

  onStatus("Loading PDF engine…");
  if (!window._jspdfReady) {
    await new Promise((resolve,reject) => {
      const sc=document.createElement("script");
      sc.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      sc.onload=()=>{window._jspdfReady=true;resolve();};
      sc.onerror=()=>reject(new Error("PDF library blocked. Use 'Open Report' and then Print → Save as PDF."));
      document.head.appendChild(sc);
    });
  }
  if (!window.jspdf?.jsPDF) throw new Error("PDF engine unavailable. Use 'Open Report' instead.");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const W=210,H=297,M=14;
  const h2r = h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const [cr,cg,cb]=h2r(col);
  const priRGB = { critical:h2r("#C0392B"), high:h2r("#E67E22"), medium:h2r("#2980B9"), low:h2r("#27AE60") };
  const priMap = Object.fromEntries(PRIORITIES.map(p=>[p.id,p]));
  const stMap  = Object.fromEntries(STATUS_LIST.map(x=>[x.id,x]));
  let pg=1;

  const hdr = () => {
    doc.setFillColor(cr,cg,cb); doc.rect(0,0,W,18,"F");
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont("helvetica","bold");
    doc.text((C.companyName||t.label)+" — NC Report",M,11);
    doc.setFontSize(8); doc.setFont("helvetica","normal");
    doc.text("Page "+pg,W-M,11,{align:"right"});
    doc.setTextColor(0,0,0);
  };
  const ftr = () => {
    const fl=[C.certifications,C.footerNote||"Confidential — For Management Use Only"].filter(Boolean).join(" | ");
    doc.setFontSize(7); doc.setTextColor(140,140,140);
    doc.text(fl.slice(0,90),M,H-6);
    doc.text("Generated: "+new Date().toLocaleString(),W-M,H-6,{align:"right"});
    doc.setTextColor(0,0,0);
  };
  const newPg = () => { ftr(); doc.addPage(); pg++; hdr(); };

  onStatus("Building cover…");
  doc.setFillColor(cr,cg,cb); doc.rect(0,0,W,60,"F");
  doc.setTextColor(255,255,255);
  if (C.companyName) { doc.setFontSize(14); doc.setFont("helvetica","bold"); doc.text(C.companyName,M,14); }
  if (C.tagline)     { doc.setFontSize(9);  doc.setFont("helvetica","normal"); doc.text(C.tagline,M,21); }
  const ty = C.companyName ? 32 : 24;
  doc.setFontSize(20); doc.setFont("helvetica","bold"); doc.text(t.label,M,ty);
  doc.setFontSize(11); doc.setFont("helvetica","normal"); doc.text("Non-Conformance Report",M,ty+9);
  doc.setFontSize(8); doc.text("Standard: "+t.standard,M,ty+17);
  doc.setTextColor(0,0,0);
  let y=68;
  const metas=[["Site",site],["Auditor",s.auditor],["Date",s.date],
    ["Total NCs",String(ncs.length)],["Open",String(ncs.filter(n=>n.status==="open").length)],
    ["Closed",String(ncs.filter(n=>n.status==="closed").length)]];
  if(C.certifications) metas.push(["ISO/Certs",C.certifications]);
  metas.forEach(([k,v])=>{
    doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.text(k+":",M,y);
    doc.setFont("helvetica","normal"); doc.text(v||"—",M+38,y); y+=7;
  });
  if(s.preface){ y+=3; doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.text("Preface:",M,y); y+=5;
    doc.setFont("helvetica","normal"); doc.setFontSize(8);
    const pl=doc.splitTextToSize(s.preface,W-M*2); doc.text(pl,M,y); y+=pl.length*4.5+3; }
  ftr();

  // Summary table
  doc.addPage(); pg++; hdr(); y=24;
  doc.setFontSize(12); doc.setFont("helvetica","bold"); doc.text("NC Summary",M,y); y+=8;
  const cw=[8,8,26,22,14,18,26]; const cx=[M];
  cw.slice(1).forEach((_,i)=>cx.push(cx[i]+cw[i]));
  doc.setFillColor(cr,cg,cb); doc.rect(M,y,W-M*2,7,"F");
  ["#","Pri","Category","Sub-loc","Status","Date","Description"].forEach((h,i)=>{
    doc.setTextColor(255,255,255); doc.setFontSize(6.5); doc.setFont("helvetica","bold");
    doc.text(h,cx[i]+1,y+4.8);
  });
  doc.setTextColor(0,0,0); y+=7;
  ncs.forEach((nc,idx)=>{
    if(y>H-22){newPg();y=24;}
    if(idx%2===0){doc.setFillColor(240,244,255);doc.rect(M,y,W-M*2,7,"F");}
    const pri=priMap[nc.priority]||PRIORITIES[1]; const st=stMap[nc.status]||STATUS_LIST[0];
    doc.setFontSize(6); doc.setFont("helvetica","normal");
    const row=[String(nc.ncIndex||idx+1),(pri.label||"").slice(0,3).toUpperCase(),(nc.category||"").slice(0,14),(nc.sublocation||"—").slice(0,10),(st.label||"").slice(0,9),s.date,(nc.description||"").slice(0,22)+(nc.description?.length>22?"…":"")];
    row.forEach((v,i)=>doc.text(v,cx[i]+1,y+4.5)); y+=7;
  });
  ftr();

  // NC detail pages
  onStatus("Adding NC details…");
  for(let idx=0;idx<ncs.length;idx++){
    const nc=ncs[idx]; const pri=priMap[nc.priority]||PRIORITIES[1]; const st=stMap[nc.status]||STATUS_LIST[0];
    doc.addPage(); pg++; hdr(); y=24;
    const [pr2,pg2,pb2]=priRGB[nc.priority]||[200,100,50];
    doc.setFillColor(pr2,pg2,pb2); doc.rect(M,y,W-M*2,9,"F");
    doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont("helvetica","bold");
    doc.text("NC "+(nc.ncIndex||idx+1)+"  ·  "+pri.label+" Priority  ·  "+st.label,M+2,y+6);
    doc.setTextColor(0,0,0); y+=13;
    const flds=[["Site",site],["Sub-location",nc.sublocation||"—"],["Auditor",s.auditor],["Date",s.date],["Category",nc.category||"—"],["Audit Type",t.label]];
    const hw=(W-M*2)/2;
    flds.forEach(([k,v],i)=>{
      const fx=M+(i%2)*hw; const fy=y+Math.floor(i/2)*8.5;
      doc.setFont("helvetica","bold"); doc.setFontSize(7.5); doc.text(k+":",fx,fy);
      doc.setFont("helvetica","normal"); doc.text(String(v||"—").slice(0,30),fx+23,fy);
    });
    y+=Math.ceil(flds.length/2)*8.5+4;
    doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.text("Observation:",M,y); y+=5;
    const dl=doc.splitTextToSize(nc.description||"",W-M*2-4); const dh=dl.length*5+5;
    doc.setFillColor(240,244,255); doc.roundedRect(M,y,W-M*2,dh,2,2,"F");
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.text(dl,M+2,y+4); y+=dh+5;
    const py=y; let photoAdded=false;
    if(nc.snagPhoto){doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text("Finding Photo:",M,y);y+=4;
      try{doc.addImage(nc.snagPhoto,"JPEG",M,y,82,58);photoAdded=true;}catch{doc.text("[Photo unavailable]",M,y+8);}}
    if(nc.closurePhoto){const cx2=M+88;doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text("Closure Photo:",cx2,py);
      try{doc.addImage(nc.closurePhoto,"JPEG",cx2,py+4,82,58);photoAdded=true;}catch{doc.text("[Photo unavailable]",cx2,py+12);}}
    if(photoAdded)y=py+66;
    if(nc.closureNote){doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.text("Closure Remarks:",M,y);y+=5;
      const cl=doc.splitTextToSize(nc.closureNote,W-M*2); const clh=cl.length*4.5+4;
      doc.setFillColor(234,250,241);doc.roundedRect(M,y,W-M*2,clh,2,2,"F");
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.text(cl,M+2,y+3.5);}
    doc.setDrawColor(210,210,215);doc.setLineWidth(0.3);doc.line(M,H-16,W-M,H-16);
    ftr();
  }

  onStatus("Saving…");
  const fname=(s.location||"Audit").replace(/[^a-z0-9]/gi,"_")+"_"+t.label.replace(/\s+/g,"_")+"_"+s.date+".pdf";
  doc.save(fname);
  return true;
}

// ─── Location + Sublocation Picker ───────────────────────────────────────────
function LocationPicker({ location, sublocation, onLoc, onSub, masterData }) {
  const [locQ,setLocQ]=useState(location||""); const [showL,setShowL]=useState(false);
  const [subQ,setSubQ]=useState(sublocation||""); const [showS,setShowS]=useState(false);
  const lRef=useRef(); const sRef=useRef(); const lInp=useRef(); const sInp=useRef();
  useEffect(()=>setLocQ(location||""),[location]);
  useEffect(()=>setSubQ(sublocation||""),[sublocation]);
  useEffect(()=>{
    const h=e=>{ if(lRef.current&&!lRef.current.contains(e.target))setShowL(false);
                  if(sRef.current&&!sRef.current.contains(e.target))setShowS(false); };
    document.addEventListener("pointerdown",h); return()=>document.removeEventListener("pointerdown",h);
  },[]);
  const locs=masterData.locations||[];
  const filtL=locs.filter(s=>!locQ||s.name.toLowerCase().includes(locQ.toLowerCase()));
  const selLoc=locs.find(s=>s.name===location); const savedSubs=selLoc?.sublocations||[];
  const filtS=savedSubs.filter(s=>!subQ||s.toLowerCase().includes(subQ.toLowerCase()));
  const DD=({children})=>(
    <div style={{position:"absolute",top:"calc(100% + 5px)",left:0,right:0,zIndex:999,background:"#fff",borderRadius:10,border:"1px solid #E0E0E0",boxShadow:"0 6px 24px rgba(0,0,0,0.13)",overflow:"hidden",maxHeight:200,overflowY:"auto"}}>
      {children}
    </div>
  );
  const DI=({label,onPick,active})=>(
    <button onPointerDown={e=>{e.preventDefault();onPick();}} style={{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"10px 13px",border:"none",background:active?"#F0F7FF":"none",textAlign:"left",cursor:"pointer",fontSize:13,color:active?"#2980B9":"#1a1a1a",borderBottom:"1px solid #F5F5F5",fontWeight:active?700:400}}>
      {label}{active&&<span style={{marginLeft:"auto",fontSize:11}}>✓</span>}
    </button>
  );
  return (
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <div ref={lRef} style={{position:"relative"}}>
        <div style={SLBL}>📍 Location / Site *</div>
        <div style={{position:"relative"}}>
          <input ref={lInp} value={locQ} onChange={e=>{setLocQ(e.target.value);onLoc(e.target.value);setShowL(true);}} onFocus={()=>setShowL(true)} placeholder="Select or type site…" style={{...INP,paddingRight:locQ?34:12}} autoComplete="off" autoCorrect="off" spellCheck={false}/>
          {locQ&&<button onPointerDown={e=>{e.preventDefault();setLocQ("");onLoc("");setSubQ("");onSub("");lInp.current?.focus();}} style={{position:"absolute",right:9,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#bbb"}}>✕</button>}
        </div>
        {showL&&<DD>

        </DD>}

            {subQ&&<button onPointerDown={e=>{e.preventDefault();setSubQ("");onSub("");sInp.current?.focus();}} style={{position:"absolute",right:9,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#bbb"}}>✕</button>}
          </div>
          {showS&&(filtS.length>0||subQ.trim())&&<DD>
            {filtS.map(s=><DI key={s} label={"🏢 "+s} onPick={()=>{setSubQ(s);onSub(s);setShowS(false);}} active={sublocation===s}/>)}

          </DD>}
        </div>
      )}
    </div>
  );
}

// ─── Start Audit ──────────────────────────────────────────────────────────────
function StartAudit({ masterData, onStart }) {
  const [auditType,setAuditType]=useState("fire");
  const [location,setLocation]=useState(""); const [subloc,setSubloc]=useState("");
  const [auditor,setAuditor]=useState(""); const [custAud,setCustAud]=useState("");
  const [date,setDate]=useState(new Date().toISOString().slice(0,10));
  const [preface,setPreface]=useState("");
  const selType=AUDIT_TYPES.find(a=>a.id===auditType);
  const auditors=masterData.auditors||[];
  const finalAud=auditor==="__new__"?custAud:auditor;
  function start(){
    if(!location.trim()){alert("Please enter a site / location.");return;}
    if(!finalAud.trim()){alert("Please enter auditor name.");return;}
    onStart({auditType,location:location.trim(),sublocation:subloc.trim(),auditor:finalAud.trim(),date,preface});
  }
  return(
    <div style={{background:"#F4F5F7",minHeight:"100vh",padding:"18px 14px 60px"}}>
      <div style={{maxWidth:520,margin:"0 auto"}}>
        <div style={{fontWeight:800,fontSize:22,color:"#1a1a1a",marginBottom:2}}>🔍 New Audit Session</div>
        <div style={{fontSize:13,color:"#888",marginBottom:18}}>Set up your audit before logging NCs</div>
        <div style={{...card({padding:16}),marginBottom:12}}>
          <div style={SLBL}>Audit Type</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {AUDIT_TYPES.map(t=>(
              <button key={t.id} onClick={()=>setAuditType(t.id)} style={{padding:"11px 9px",borderRadius:10,cursor:"pointer",textAlign:"left",border:auditType===t.id?"2px solid "+t.color:"1.5px solid #E8E8E8",background:auditType===t.id?t.color+"12":"#fff"}}>
                <div style={{fontSize:20,marginBottom:4}}>{t.icon}</div>
                <div style={{fontSize:12,fontWeight:700,color:auditType===t.id?t.color:"#333"}}>{t.label}</div>
                <div style={{fontSize:10,color:"#aaa",marginTop:2}}>{t.standard}</div>
              </button>
            ))}
          </div>
        </div>
        <div style={{...card({padding:16}),marginBottom:12}}>
          <LocationPicker location={location} sublocation={subloc} onLoc={setLocation} onSub={setSubloc} masterData={masterData}/>
        </div>
        <div style={{...card({padding:16}),marginBottom:12}}>
          <div style={SLBL}>👤 Auditor Name</div>
          {auditors.length>0?(
            <>
              <select value={auditor} onChange={e=>setAuditor(e.target.value)} style={INP}>
                <option value="">— Select auditor —</option>
                {auditors.map(a=><option key={a} value={a}>{a}</option>)}
                <option value="__new__">+ New auditor…</option>
              </select>
              {auditor==="__new__"&&<input value={custAud} onChange={e=>setCustAud(e.target.value)} placeholder="Type auditor name" style={{...INP,marginTop:8}}/>}
            </>
          ):(
            <input value={auditor} onChange={e=>setAuditor(e.target.value)} placeholder="e.g. Ravi Sharma" style={INP}/>
          )}
        </div>
        <div style={{...card({padding:16}),marginBottom:12}}>
          <div style={SLBL}>📅 Audit Date</div>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...INP,marginBottom:14}}/>
          <div style={SLBL}>📝 Preface / Scope <span style={{color:"#ccc",fontWeight:400,textTransform:"none"}}>(optional)</span></div>
          <textarea value={preface} onChange={e=>setPreface(e.target.value)} rows={3} placeholder={"Annual "+selType?.label+". Reference: "+selType?.standard+"."} style={{...INP,resize:"vertical",lineHeight:1.6}}/>
        </div>
        <button onClick={start} style={{width:"100%",padding:15,borderRadius:12,border:"none",background:selType?.color||"#1a1a1a",color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",boxShadow:"0 4px 16px "+(selType?.color||"#1a1a1a")+"44"}}>

        </button>
      </div>
    </div>
  );
}

// ─── NC Form ──────────────────────────────────────────────────────────────────
function NCForm({ session, ncIndex, initial, masterData, onSave, onCancel }) {
  const selType=AUDIT_TYPES.find(t=>t.id===session.auditType);
  const [subloc,setSubloc]=useState(initial?.sublocation||session.sublocation||"");
  const [category,setCat]=useState(initial?.category||selType?.categories[0]||"");
  const [priority,setPri]=useState(initial?.priority||"high");
  const [desc,setDesc]=useState(initial?.description||"");
  const [snag,setSnag]=useState(initial?.snagPhoto||null);
  const [status,setStatus]=useState(initial?.status||"open");
  const [closure,setClosure]=useState(initial?.closurePhoto||null);
  const [clNote,setClNote]=useState(initial?.closureNote||"");

    if(!desc.trim()){alert("Please enter an observation.");return;}

              {savedSubs.map(s=>(

            {subloc&&<button onPointerDown={e=>{e.preventDefault();setSubloc("");subInp.current?.focus();}} style={{position:"absolute",right:9,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#bbb"}}>✕</button>}

        <div style={card({padding:"14px 15px"})}>
          <div style={SLBL}>Status</div>
          <div style={{display:"flex",gap:8}}>

          </div>
        </div>

        {/* Closure */}
        {(status==="closed"||status==="in_progress"||closure)&&(

        </div>
        <div style={{height:16}}/>
      </div>
    </div>
  );
}

// ─── Report Viewer ────────────────────────────────────────────────────────────
function ReportViewer({ audit, companyProfile, onClose }) {
  const { session:s, ncs } = audit;
  const t      = AUDIT_TYPES.find(x=>x.id===s.auditType)||AUDIT_TYPES[0];
  const site   = s.location+(s.sublocation?" \u203a "+s.sublocation:"");
  const color  = t.color;
  const priMap = Object.fromEntries(PRIORITIES.map(p=>[p.id,p]));
  const stMap  = Object.fromEntries(STATUS_LIST.map(x=>[x.id,x]));
  const C      = companyProfile||{};
  const [menuOpen, setMenuOpen] = useState(false);
  const [busy, setBusy]         = useState("");

  async function doAction(action) {
    setMenuOpen(false);
    if (action==="whatsapp") { shareWhatsApp(audit); return; }
    if (action==="report") {
      const html=buildReportHTML(audit,C); openReport(html); return;
    }
    if (action==="word") {
      setBusy("Building Word file…");
      try { generateWordReport(audit,C); }
      catch(e) { alert("Word error: "+e.message); }
      setBusy(""); return;
    }
    if (action==="pdf") {
      setBusy("Building PDF…");
      try { await generatePDF(audit,C,msg=>setBusy(msg)); }
      catch(e) { alert(e.message); }
      setBusy(""); return;
    }
  }

  return(
    <div style={{position:"fixed",inset:0,zIndex:9999,background:"#fff",overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
      <style>{`@media print{.no-print{display:none!important}}@page{size:A4;margin:12mm}`}</style>

      {/* Action bar */}
      <div className="no-print" style={{position:"sticky",top:0,zIndex:100,background:color,color:"#fff",padding:"12px 16px",display:"flex",alignItems:"center",gap:10}}>
        <button onClick={onClose} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",padding:"8px 14px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer"}}>← Back</button>
        <div style={{flex:1,fontWeight:700,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.icon} {t.label} — {site}</div>
        <div style={{position:"relative"}}>
          <button onClick={e=>{e.stopPropagation();setMenuOpen(v=>!v);}} disabled={!!busy} style={{background:"#fff",border:"none",color:color,padding:"8px 16px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",opacity:busy?0.6:1,flexShrink:0}}>
            {busy||"📤 Share"}
          </button>
          {menuOpen&&(
            <>
              <div onClick={()=>setMenuOpen(false)} style={{position:"fixed",inset:0,zIndex:199}}/>

          {C.tagline&&<div style={{fontSize:12,opacity:0.85,marginBottom:12}}>{C.tagline}</div>}

              <div key={k}><div style={{fontSize:10,opacity:0.7,textTransform:"uppercase",letterSpacing:0.5,marginBottom:2}}>{k}</div><div style={{fontSize:13,fontWeight:600}}>{v||"—"}</div></div>

          {s.preface&&<div style={{background:"rgba(255,255,255,0.13)",borderRadius:8,padding:"9px 12px",fontSize:12,lineHeight:1.6,opacity:0.9}}>{s.preface}</div>}
          <div style={{display:"flex",gap:8,marginTop:14}}>
            {[["Total",ncs.length],["Open",ncs.filter(n=>n.status==="open").length],["In Prog",ncs.filter(n=>n.status==="in_progress").length],["Closed",ncs.filter(n=>n.status==="closed").length]].map(([l,v])=>(
              <div key={l} style={{flex:1,background:"rgba(255,255,255,0.18)",borderRadius:9,padding:"10px 4px",textAlign:"center"}}>
                <div style={{fontSize:20,fontWeight:800}}>{v}</div>
                <div style={{fontSize:9,opacity:0.8}}>{l}</div>
              </div>

        <div style={{padding:"0 16px"}}>
          {/* Priority summary */}
          <div style={{background:"#F8F8FA",borderRadius:10,padding:"14px 16px",margin:"18px 0"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:0.6,marginBottom:10}}>Summary by Priority</div>
            <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
              {PRIORITIES.map(p=>{const cnt=ncs.filter(n=>n.priority===p.id).length;return(
                <div key={p.id} style={{display:"flex",alignItems:"center",gap:6,fontSize:13}}>
                  <span style={{width:10,height:10,borderRadius:"50%",background:p.color,display:"inline-block",flexShrink:0}}/>

                      <td style={{padding:"8px 10px",borderBottom:"1px solid #F0F0F0",maxWidth:200}}>{(nc.description||"").slice(0,70)}{nc.description?.length>70?"…":""}</td>

              <div key={nc.id} style={{borderRadius:12,border:"1px solid #E8E8E8",marginBottom:16,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)",borderLeft:"5px solid "+pri.color}}>

                  <span style={{fontWeight:800,fontSize:14}}>NC {nc.ncIndex}</span>
                  <span style={{opacity:0.8}}>·</span>
                  <span style={{fontWeight:700}}>{pri.label} Priority</span>
                  <span style={{opacity:0.8}}>·</span>
                  <span style={{background:"rgba(255,255,255,0.25)",padding:"2px 9px",borderRadius:20,fontSize:12,fontWeight:700}}>{st.label}</span>
                  <span style={{background:"rgba(255,255,255,0.2)",padding:"2px 9px",borderRadius:20,fontSize:12}}>{nc.category}</span>

                <div style={{padding:"14px"}}>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:10,background:"#F8F8FA",borderRadius:8,padding:"10px 12px",marginBottom:12}}>
                    {[["Site",site],["Auditor",s.auditor],["Date",s.date],["Audit Type",t.label]].map(([k,v])=>(
                      <div key={k}><div style={{fontSize:9,color:"#999",textTransform:"uppercase",letterSpacing:0.5,marginBottom:2}}>{k}</div><div style={{fontSize:12,fontWeight:600,color:"#333"}}>{v||"—"}</div></div>

                  <div style={{background:"#EEF4FF",borderLeft:"3px solid "+color,borderRadius:"0 8px 8px 0",padding:"10px 13px",fontSize:13,lineHeight:1.7,marginBottom:nc.snagPhoto||nc.closurePhoto||nc.closureNote?12:0}}>
                    <div style={{fontSize:10,color:"#666",textTransform:"uppercase",letterSpacing:0.5,marginBottom:4,fontWeight:700}}>Observation</div>
                    {nc.description}
                  </div>
                  {(nc.snagPhoto||nc.closurePhoto)&&(
                    <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:nc.closureNote?12:0}}>
                      {nc.snagPhoto&&<div><img src={nc.snagPhoto} alt="" style={{width:160,height:118,objectFit:"cover",borderRadius:9,border:"1px solid #E8E8E8",display:"block"}}/><div style={{fontSize:10,color:"#888",textAlign:"center",marginTop:4,fontWeight:600}}>🔴 Finding Photo</div></div>}
                      {nc.closurePhoto&&<div><img src={nc.closurePhoto} alt="" style={{width:160,height:118,objectFit:"cover",borderRadius:9,border:"1px solid #E8E8E8",display:"block"}}/><div style={{fontSize:10,color:"#888",textAlign:"center",marginTop:4,fontWeight:600}}>✅ Closure Photo</div></div>}
                    </div>
                  )}
                  {nc.closureNote&&<div style={{background:"#EAFAF1",borderLeft:"3px solid #27AE60",borderRadius:"0 8px 8px 0",padding:"9px 13px",fontSize:13,color:"#27AE60"}}><strong>✓ Closure Remarks:</strong> {nc.closureNote}</div>}
                  <div style={{fontSize:10,color:"#bbb",marginTop:10}}>Logged: {new Date(nc.createdAt).toLocaleString()}</div>
                </div>
              </div>

          })}

            <div style={{borderTop:"1px solid #E8E8E8",paddingTop:14,fontSize:11,color:"#aaa",textAlign:"center",lineHeight:1.7}}>
              {[C.certBody,C.certifications,C.certNumber?"Cert# "+C.certNumber:null,C.footerNote||"Confidential — For Management Use Only"].filter(Boolean).join("  |  ")}
            </div>
          )}
          <div style={{fontSize:10,color:"#bbb",textAlign:"center",marginTop:8}}>Generated: {new Date().toLocaleString()}</div>
        </div>
      </div>
    </div>
  );
}

// ─── Reports Screen ───────────────────────────────────────────────────────────

  return(

      <div style={{fontWeight:800,fontSize:20,color:"#1a1a1a",marginBottom:4}}>📁 Audit History</div>
      <div style={{fontSize:13,color:"#888",marginBottom:16}}>Tap 👁 View to see report and share/export</div>
      {pdfStatus&&pdfStatus!=="error"&&(
        <div style={{background:"#E6F1FB",border:"1px solid #B5D4F4",borderRadius:10,padding:"11px 14px",marginBottom:12,fontSize:13,color:"#185FA5",fontWeight:600,display:"flex",alignItems:"center",gap:8}}>
          ⏳ {pdfStatus}
        </div>
      )}

          <div style={{fontSize:42,marginBottom:10}}>📂</div>
          <div style={{fontWeight:600,fontSize:15,color:"#888"}}>No audits yet</div>
          <div style={{fontSize:12,color:"#bbb",marginTop:4}}>Start your first audit from the Home tab</div>

          const t=AUDIT_TYPES.find(x=>x.id===a.session.auditType); const openNCs=a.ncs.filter(n=>n.status==="open").length;
          return(
            <div key={a.id} style={{...card({overflow:"hidden"}),borderLeft:"4px solid "+(t?.color||"#888")}}>
              <div style={{padding:"13px 14px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:14,color:"#1a1a1a"}}>{t?.icon} {t?.label}</div>
                    <div style={{fontSize:12,color:"#555",marginTop:3}}>📍 {a.session.location}{a.session.sublocation?" \u203a "+a.session.sublocation:""}</div>
                    <div style={{fontSize:11,color:"#888",marginTop:1}}>👤 {a.session.auditor} · 📅 {a.session.date}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontWeight:800,fontSize:22,color:"#1a1a1a"}}>{a.ncs.length}</div>
                    <div style={{fontSize:10,color:"#aaa"}}>NCs</div>
                    {openNCs>0&&<div style={{fontSize:10,color:"#C0392B",fontWeight:600}}>{openNCs} open</div>}
                  </div>
                </div>
                {a.session.preface&&<div style={{fontSize:11,color:"#888",marginTop:6,lineHeight:1.5}}>{a.session.preface.slice(0,100)}{a.session.preface.length>100?"…":""}</div>}
              </div>
              <div style={{display:"flex",borderTop:"1px solid #F0F0F0"}}>
                <button onClick={()=>onOpen(a)} style={{flex:1,padding:"10px 4px",border:"none",background:"none",cursor:"pointer",fontSize:11,color:"#2980B9",fontWeight:600}}>📂 Open</button>
                <div style={{width:1,background:"#F0F0F0"}}/>
                <button onClick={()=>onView(a)} style={{flex:1,padding:"10px 4px",border:"none",background:"#FFF8F0",cursor:"pointer",fontSize:11,color:"#C45911",fontWeight:700}}>👁 View</button>
                <div style={{width:1,background:"#F0F0F0"}}/>
                <button onClick={()=>onPDF(a)} disabled={!!pdfStatus&&pdfStatus!=="error"} style={{flex:1,padding:"10px 4px",border:"none",background:"none",cursor:"pointer",fontSize:11,color:"#C0392B",fontWeight:600,opacity:!!pdfStatus&&pdfStatus!=="error"?0.5:1}}>📄 PDF</button>
                <div style={{width:1,background:"#F0F0F0"}}/>
                <button onClick={()=>onWord(a)} disabled={!!pdfStatus&&pdfStatus!=="error"} style={{flex:1,padding:"10px 4px",border:"none",background:"none",cursor:"pointer",fontSize:11,color:"#1F618D",fontWeight:600,opacity:!!pdfStatus&&pdfStatus!=="error"?0.5:1}}>📝 Word</button>
                <div style={{width:1,background:"#F0F0F0"}}/>
                <button onClick={()=>{if(window.confirm("Delete this audit?"))onDelete(a.id);}} style={{flex:1,padding:"10px 4px",border:"none",background:"none",cursor:"pointer",fontSize:11,color:"#C0392B",fontWeight:600}}>🗑</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── My Lists ─────────────────────────────────────────────────────────────────
function ListSection({ title, emoji, items, onAdd, onRemove, placeholder, children }) {
  const [newVal,setNewVal]=useState("");
  const doAdd=useCallback(()=>{if(!newVal.trim())return;onAdd(newVal.trim());setNewVal("");},[newVal,onAdd]);
  return(
    <div style={{...card({padding:16}),marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <span style={{fontWeight:700,fontSize:14,color:"#1a1a1a"}}>{emoji} {title}</span>
        <span style={{fontSize:11,color:"#aaa"}}>{items.length} saved</span>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <input value={newVal} onChange={e=>setNewVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doAdd()} style={{...INP,flex:1,fontSize:13}} placeholder={placeholder}/>
        <button onClick={doAdd} style={{...BTN("#1a1a1a","#fff",{flexShrink:0,padding:"10px 16px",fontSize:13})}}>＋ Add</button>
      </div>
      {items.length===0&&<div style={{fontSize:12,color:"#ccc",textAlign:"center",padding:"5px 0"}}>No items yet</div>}
      {items.map((item,i)=>(
        <div key={typeof item==="string"?item+i:item.name+i} style={{marginBottom:6}}>
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:"#F8F8F8",borderRadius:8}}>
            <span style={{flex:1,fontSize:13,color:"#333"}}>{typeof item==="string"?item:item.name}</span>
            <button onClick={()=>onRemove(typeof item==="string"?item:item.name)} style={{background:"none",border:"none",cursor:"pointer",color:"#C0392B",fontSize:16,lineHeight:1,padding:"0 4px"}}>✕</button>
          </div>
          {children&&children(item,i)}
        </div>
      ))}
    </div>
  );
}

function SubLocSection({ loc, onAddSub, onRemoveSub }) {
  const [newSub,setNewSub]=useState("");
  const subs=loc.sublocations||[];
  const doAdd=useCallback(()=>{if(!newSub.trim())return;onAddSub(loc.name,newSub.trim());setNewSub("");},[newSub,loc.name,onAddSub]);
  return(
    <div style={{marginTop:4,marginLeft:12,paddingLeft:10,borderLeft:"2px solid #E8E8E8"}}>
      <div style={{fontSize:11,color:"#888",fontWeight:600,marginBottom:5}}>Sub-locations / Areas</div>
      {subs.map(s=>(
        <div key={s} style={{display:"flex",alignItems:"center",gap:5,padding:"4px 7px",background:"#F0F0F0",borderRadius:5,marginBottom:3}}>
          <span style={{flex:1,fontSize:12,color:"#555"}}>🏢 {s}</span>
          <button onClick={()=>onRemoveSub(loc.name,s)} style={{background:"none",border:"none",cursor:"pointer",color:"#C0392B",fontSize:12,lineHeight:1,padding:"0 2px"}}>✕</button>
        </div>
      ))}
      <div style={{display:"flex",gap:5,marginTop:4}}>
        <input value={newSub} onChange={e=>setNewSub(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doAdd()} style={{...INP,flex:1,fontSize:12,padding:"6px 9px"}} placeholder="Add sub-location…"/>
        <button onClick={doAdd} style={{...BTN("#555","#fff",{padding:"6px 11px",fontSize:12,flexShrink:0})}}>＋</button>
      </div>
    </div>
  );
}

function MyLists({ masterData, setMasterData, onExport, onImport }) {
  const addLoc    = useCallback(n=>setMasterData(d=>({...d,locations:[...d.locations.filter(l=>l.name!==n),{name:n,sublocations:[]}]})),[setMasterData]);
  const removeLoc = useCallback(n=>setMasterData(d=>({...d,locations:d.locations.filter(l=>l.name!==n)})),[setMasterData]);
  const addSub    = useCallback((ln,s)=>setMasterData(d=>({...d,locations:d.locations.map(l=>l.name===ln?{...l,sublocations:[...new Set([...(l.sublocations||[]),s])]}:l)})),[setMasterData]);
  const remSub    = useCallback((ln,s)=>setMasterData(d=>({...d,locations:d.locations.map(l=>l.name===ln?{...l,sublocations:(l.sublocations||[]).filter(x=>x!==s)}:l)})),[setMasterData]);
  const addAud    = useCallback(n=>setMasterData(d=>({...d,auditors:[...new Set([...d.auditors,n])]})),[setMasterData]);
  const remAud    = useCallback(n=>setMasterData(d=>({...d,auditors:d.auditors.filter(a=>a!==n)})),[setMasterData]);
  return(
    <div style={{background:"#F4F5F7",minHeight:"100vh",padding:"18px 14px 40px"}}>
      <div style={{fontWeight:800,fontSize:20,color:"#1a1a1a",marginBottom:4}}>⚙️ My Lists</div>
      <div style={{fontSize:13,color:"#888",marginBottom:16}}>Pre-save for quick selection during audits</div>
      <ListSection title="Sites / Locations" emoji="📍" items={masterData.locations||[]} onAdd={addLoc} onRemove={removeLoc} placeholder="e.g. Plant A, School…">
        {loc=><SubLocSection loc={loc} onAddSub={addSub} onRemoveSub={remSub}/>}
      </ListSection>
      <ListSection title="Auditors" emoji="👤" items={masterData.auditors||[]} onAdd={addAud} onRemove={remAud} placeholder="e.g. Ravi Sharma"/>
      <div style={{display:"flex",gap:8}}>
        <button onClick={onExport} style={{flex:1,padding:12,borderRadius:10,border:"1.5px solid #ddd",background:"#fff",color:"#333",fontSize:13,fontWeight:600,cursor:"pointer"}}>📤 Export Data</button>
        <button onClick={onImport} style={{flex:1,padding:12,borderRadius:10,border:"1.5px solid #ddd",background:"#fff",color:"#333",fontSize:13,fontWeight:600,cursor:"pointer"}}>📥 Import Data</button>
      </div>
    </div>
  );
}

// ─── Company Profile ──────────────────────────────────────────────────────────
function CompanyProfile({ profile, setProfile }) {
  const logoRef=useRef();
  const set=(k,v)=>setProfile(p=>({...p,[k]:v}));
  async function handleLogo(e) { const f=e.target.files[0]; if(f){set("logo",await toB64(f));} e.target.value=""; }
  const fld={marginBottom:13}; const lbl={fontSize:12,color:"#555",fontWeight:600,display:"block",marginBottom:5};
  return(
    <div style={{background:"#F4F5F7",minHeight:"100vh",padding:"18px 14px 48px"}}>
      <div style={{fontWeight:800,fontSize:20,color:"#1a1a1a",marginBottom:3}}>🏢 Company Profile</div>
      <div style={{fontSize:13,color:"#888",marginBottom:18}}>Appears on every PDF and Word report</div>
      <div style={{...card({padding:16}),marginBottom:12}}>
        <div style={SLBL}>Company Logo</div>
        <div style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
          {profile.logo?(
            <div style={{position:"relative"}}>
              <img src={profile.logo} alt="logo" style={{height:72,maxWidth:180,objectFit:"contain",borderRadius:8,border:"1px solid #E8E8E8",background:"#fafafa",padding:4}}/>
              <button onClick={()=>set("logo",null)} style={{position:"absolute",top:-6,right:-6,width:20,height:20,borderRadius:"50%",border:"none",background:"#C0392B",color:"#fff",fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
            </div>
          ):(
            <div style={{width:120,height:72,borderRadius:8,border:"2px dashed #ddd",background:"#fafafa",display:"flex",alignItems:"center",justifyContent:"center",color:"#bbb",fontSize:12}}>No logo</div>
          )}
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <button onClick={()=>logoRef.current.click()} style={BTN("#1a1a1a","#fff",{padding:"9px 16px",fontSize:13})}>📷 Upload Logo</button>
            <div style={{fontSize:11,color:"#aaa",lineHeight:1.5}}>PNG or JPEG recommended</div>
          </div>
        </div>
        <input ref={logoRef} type="file" accept="image/png,image/jpeg,image/jpg" style={{display:"none"}} onChange={handleLogo}/>
      </div>
      <div style={{...card({padding:16}),marginBottom:12}}>
        <div style={SLBL}>Company Details</div>
        <div style={fld}><label style={lbl}>Company / Organisation Name</label><input style={INP} value={profile.companyName||""} onChange={e=>set("companyName",e.target.value)} placeholder="e.g. Makwana Engineering & Technical Services"/></div>
        <div style={fld}><label style={lbl}>Tagline / Motto</label><input style={INP} value={profile.tagline||""} onChange={e=>set("tagline",e.target.value)} placeholder="e.g. Safety First · Excellence Always"/></div>
        <div style={fld}><label style={lbl}>Address / Location</label><input style={INP} value={profile.address||""} onChange={e=>set("address",e.target.value)} placeholder="e.g. Mumbai, Maharashtra"/></div>
        <div style={{marginBottom:0}}><label style={lbl}>Contact / Website</label><input style={INP} value={profile.contact||""} onChange={e=>set("contact",e.target.value)} placeholder="e.g. +91 98765 43210"/></div>
      </div>
      <div style={{...card({padding:16}),marginBottom:12}}>
        <div style={SLBL}>ISO & Certifications</div>
        <div style={fld}><label style={lbl}>Certifications (comma separated)</label><input style={INP} value={profile.certifications||""} onChange={e=>set("certifications",e.target.value)} placeholder="e.g. ISO 9001:2015, ISO 45001:2018"/></div>
        <div style={fld}><label style={lbl}>Certification Body</label><input style={INP} value={profile.certBody||""} onChange={e=>set("certBody",e.target.value)} placeholder="e.g. Bureau Veritas · TÜV SÜD"/></div>
        <div style={fld}><label style={lbl}>Certificate Number(s)</label><input style={INP} value={profile.certNumber||""} onChange={e=>set("certNumber",e.target.value)} placeholder="e.g. BV-QMS-123456"/></div>
        <div style={{marginBottom:0}}><label style={lbl}>Report Footer Note</label><textarea style={{...INP,resize:"vertical",lineHeight:1.5}} rows={2} value={profile.footerNote||""} onChange={e=>set("footerNote",e.target.value)} placeholder="e.g. Prepared for management review. Confidential."/></div>
      </div>
      {(profile.companyName||profile.logo)&&(
        <div style={{...card({padding:16}),marginBottom:12,border:"1px solid #B5D4F4"}}>
          <div style={SLBL}>Preview</div>
          <div style={{background:"#2980B9",borderRadius:8,padding:"14px 16px",color:"#fff"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div>
                {profile.companyName&&<div style={{fontWeight:700,fontSize:14}}>{profile.companyName}</div>}
                {profile.tagline&&<div style={{fontSize:11,opacity:0.85}}>{profile.tagline}</div>}
              </div>
              {profile.logo&&<img src={profile.logo} alt="logo" style={{height:40,maxWidth:80,objectFit:"contain",background:"rgba(255,255,255,0.9)",borderRadius:4,padding:3}}/>}
            </div>
            <div style={{borderTop:"1px solid rgba(255,255,255,0.3)",paddingTop:8,fontSize:11}}>
              <div style={{fontWeight:600,marginBottom:2}}>Fire Safety Audit — NC Report</div>
              {profile.certifications&&<div style={{opacity:0.75,fontSize:9,marginTop:2}}>{profile.certifications}</div>}
            </div>
          </div>
        </div>
      )}
      <div style={{background:"#EAFAF1",border:"1px solid #A9DFBF",borderRadius:10,padding:"12px 14px",fontSize:12,color:"#1E8449"}}>
        ✅ Saved automatically — appears on all future reports
      </div>
    </div>
  );
}

// ─── Bottom Nav ───────────────────────────────────────────────────────────────
function BottomNav({ tab, setTab, hasActive }) {
  const TABS=[{id:"home",l:"Home",e:"🏠"},{id:"active",l:"Active",e:"📋"},{id:"reports",l:"Reports",e:"📁"},{id:"lists",l:"Lists",e:"⚙️"},{id:"company",l:"Company",e:"🏢"}];
  return(
    <div style={{display:"flex",background:"#fff",borderTop:"1px solid #E8E8E8",flexShrink:0}}>
      {TABS.map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 4px 8px",border:"none",background:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,color:tab===t.id?"#1a1a1a":"#aaa",borderTop:tab===t.id?"2px solid #1a1a1a":"2px solid transparent",position:"relative"}}>
          <span style={{fontSize:19}}>{t.e}</span>
          <span style={{fontSize:9,fontWeight:tab===t.id?700:500}}>{t.l}</span>
          {t.id==="active"&&hasActive&&<span style={{position:"absolute",width:7,height:7,borderRadius:"50%",background:"#C0392B",top:8,right:"22%"}}/>}
        </button>
      ))}
    </div>
  );
}

// ─── Root App ─────────────────────────────────────────────────────────────────
function App() {
  const [audits,         setAudits]         = usePersist("anc_audits",  []);
  const [masterData,     setMasterData]     = usePersist("anc_master",  {locations:[],auditors:[]});
  const [companyProfile, setCompanyProfile] = usePersist("anc_company", {logo:null,companyName:"",tagline:"",address:"",contact:"",certifications:"",certBody:"",certNumber:"",footerNote:""});
  const [tab,            setTab]            = useState("home");
  const [active,         setActive]         = useState(null);
  const [view,           setView]           = useState("session");
  const [editingNC,      setEditingNC]      = useState(null);
  const [pdfStatus,      setPdfStatus]      = useState(null);
  const [viewingReport,  setViewingReport]  = useState(null);

  function startAudit(session) {
    const audit={id:genId(),session,ncs:[],createdAt:new Date().toISOString()};
    setMasterData(d=>{
      const exists=d.locations.find(l=>l.name===session.location);
      const locs=exists?d.locations:[...d.locations,{name:session.location,sublocations:[]}];
      const auds=session.auditor?[...new Set([...d.auditors,session.auditor])]:d.auditors;
      return{...d,locations:locs,auditors:auds};
    });
    setAudits(prev=>[audit,...prev]);
    setActive(audit); setView("session"); setTab("active");
  }

  function saveNC(nc) {
    setAudits(prev=>prev.map(a=>{
      if(a.id!==active.id)return a;
      const ncs=editingNC?a.ncs.map(n=>n.id===nc.id?nc:n):[...a.ncs,nc];
      const updated={...a,ncs}; setActive(updated); return updated;
    }));
    setEditingNC(null); setView("session");
  }

  function deleteNC(ncId) {
    setAudits(prev=>prev.map(a=>{
      if(a.id!==active.id)return a;
      const ncs=a.ncs.filter(n=>n.id!==ncId).map((n,i)=>({...n,ncIndex:i+1}));
      const updated={...a,ncs}; setActive(updated); return updated;
    }));
  }

  async function handlePDF(audit) {
    if(!audit.ncs||audit.ncs.length===0){alert("No NCs to generate a report for.");return;}
    setPdfStatus("Loading PDF engine…");
    try {
      await generatePDF(audit,companyProfile,msg=>setPdfStatus(msg));
      setPdfStatus("✅ PDF downloaded!");
      setTimeout(()=>setPdfStatus(null),4000);
    } catch(e) {
      alert(e.message);
      setPdfStatus("error");
      setTimeout(()=>setPdfStatus(null),4000);
    }
  }

  function handleWord(audit) {
    if(!audit.ncs||audit.ncs.length===0){alert("No NCs to generate a report for.");return;}
    setPdfStatus("Building Word document…");
    try { generateWordReport(audit,companyProfile); setPdfStatus(null); }
    catch(e) { alert("Word error: "+e.message); setPdfStatus("error"); setTimeout(()=>setPdfStatus(null),4000); }
  }

  function exportData() {
    const b=new Blob([JSON.stringify({audits,masterData,companyProfile},null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download="audit_backup_"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click();
    setTimeout(()=>a.remove(),2000);
  }
  function importData() {
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
    inp.onchange=async e=>{
      try {
        const d=JSON.parse(await e.target.files[0].text());
        if(d.audits)setAudits(d.audits);
        if(d.masterData)setMasterData(d.masterData);
        if(d.companyProfile)setCompanyProfile(d.companyProfile);
        alert("Imported successfully!");
      } catch { alert("Import failed — invalid file."); }
    };
    inp.click();
  }

  // Show report viewer full-screen
  if(viewingReport) {
    return <ReportViewer audit={viewingReport} companyProfile={companyProfile} onClose={()=>setViewingReport(null)}/>;
  }

  // Active audit full-screen sub-views
  if(tab==="active"&&active){
    if(view==="addNC") return(
      <div style={{display:"flex",flexDirection:"column",height:"100vh"}}>
        <div style={{flex:1,overflowY:"auto"}}><NCForm session={active.session} ncIndex={active.ncs.length+1} initial={null} masterData={masterData} onSave={saveNC} onCancel={()=>setView("session")}/></div>
        <BottomNav tab={tab} setTab={setTab} hasActive={true}/>
      </div>
    );
    if(view==="editNC"&&editingNC) return(
      <div style={{display:"flex",flexDirection:"column",height:"100vh"}}>
        <div style={{flex:1,overflowY:"auto"}}><NCForm session={active.session} ncIndex={editingNC.ncIndex} initial={editingNC} masterData={masterData} onSave={saveNC} onCancel={()=>{setEditingNC(null);setView("session");}}/></div>
        <BottomNav tab={tab} setTab={setTab} hasActive={true}/>
      </div>
    );
  }

  const SCREENS={
    home:    <StartAudit masterData={masterData} onStart={startAudit}/>,
    active:  active?(
      <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
        <div style={{flex:1,overflowY:"auto"}}><SessionView session={active.session} ncs={active.ncs} onAdd={()=>setView("addNC")} onEdit={nc=>{setEditingNC(nc);setView("editNC");}} onDelete={deleteNC}/></div>
      </div>
    ):(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",padding:32,textAlign:"center"}}>
        <div style={{fontSize:52,marginBottom:16}}>📋</div>
        <div style={{fontSize:16,fontWeight:700,color:"#555",marginBottom:8}}>No active audit</div>
        <div style={{fontSize:12,color:"#bbb"}}>Start one from the Home tab</div>
        <button onClick={()=>setTab("home")} style={{marginTop:20,padding:"12px 28px",borderRadius:11,border:"none",background:"#1a1a1a",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>Start Audit →</button>
      </div>
    ),
    reports: <Reports audits={audits} onOpen={a=>{setActive(a);setView("session");setTab("active");}} onView={a=>setViewingReport(a)} onDelete={id=>setAudits(p=>p.filter(a=>a.id!==id))} onPDF={handlePDF} onWord={handleWord} pdfStatus={pdfStatus}/>,
    lists:   <MyLists masterData={masterData} setMasterData={setMasterData} onExport={exportData} onImport={importData}/>,
    company: <CompanyProfile profile={companyProfile} setProfile={setCompanyProfile}/>,
  };

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:"#F4F5F7",overflow:"hidden"}}>
      <div style={{flex:1,overflowY:"auto"}}>{SCREENS[tab]}</div>
      <BottomNav tab={tab} setTab={setTab} hasActive={!!active}/>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(App)
);
</script>
</body>
</html>
